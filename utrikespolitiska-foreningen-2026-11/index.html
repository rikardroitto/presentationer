function wob(r,n,amp,periodic,hs=[1,2,3,5],fall=1){const o=new Float32Array(n);

    out[2*i]=q[j-1][0]+(q[j][0]-q[j-1][0])*u;out[2*i+1]=q[j-1][1]+(q[j][1]-q[j-1][1])*u}

function abstrakt(r){

    S.push([[x,y],[x+w+j(),y+j()],[x+w+j(),y+h+j()],[x+j(),y+h+j()],[x,y]]);

  return{aspect:1.25,strokes:S,masses:M}}

/* --- en bild = linjer + färgsjok, allt som talfält så att det går att blanda --- */
function mkLine(P,r){        // tre "drag" per linje: ett huvuddrag och två slarviga omtag

    if(len>.3*ch&&Math.hypot(P[0][0]-P[P.length-1][0],P[0][1]-P[P.length-1][1])<.06*ch)loops.push(loop(P));
    const parts=Math.max(1,Math.ceil(len/650)),q=resample(P,parts*(N-1)+1,false);
    for(let k=0;k<parts;k++){const seg=[];for(let i=0;i<N;i++){const j=k*(N-1)+i;seg.push([q[2*j],q[2*j+1]])}lines.push(mkLine(seg,r))}}
  const washes=[];
  // a) två stora, blöta bottensjok runt hela motivet
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const[x,y]of all){x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y)}
  const mx=(x0+x1)/2,my=(y0+y1)/2,rx=(x1-x0)/2,ry=(y1-y0)/2;
  washes.push(lagg(blob(r,mx+(r()-.5)*rx*.5,my-ry*.3,rx*1.05,ry*.75,.7),pal[0],.55,.5));
  washes.push(lagg(blob(r,mx+(r()-.5)*rx*.5,my+ry*.35,rx*.95,ry*.7,.6),pal[1%pal.length],.5,.45));
  // b) sjok vid linjernas tyngdpunkter (längst-bort-urval)
  const seeds=[all[Math.floor(r()*all.length)]];
  while(seeds.length<4){let best=null,bd=-1;for(let i=0;i<all.length;i+=3){const p=all[i];let d=1e9;for(const s of seeds)d=Math.min(d,Math.hypot(p[0]-s[0],p[1]-s[1]));if(d>bd){bd=d;best=p}}seeds.push(best)}
  for(const s of seeds){const q=.5+r()*.5;washes.push(lagg(blob(r,s[0]+(mx-s[0])*.3,s[1]+(my-s[1])*.3,rx*(.28+r()*.2)*q+40,ry*(.3+r()*.25)*q+40,r()),pick(),.55+r()*.3,.5+r()*.5))}
  // c) slutna former fylls med klar färg och hård kant
  loops.sort((a,b)=>b.area-a.area).slice(0,5).forEach(l=>washes.push(lagg(l.p,pick(),.9,1)));
  // d) tjocka partier blir mörkt pigment
  for(const m of(comp.masses||[]).slice(0,5)){const[x,y]=tf(m),rr=Math.max(9,m[2]*cw*1.25);washes.push(mkWash(blob(r,x,y,rr,rr,.1),[52,54,66],.95,1,r))}
  // e) zoner med fyll:true får ett eget sjok som täcker hela zonen
  for(const z of(sl.zoner||[]).filter(z=>z.fyll)){const X=z.x||[0,1],Y=z.y||[0,1],[zx,zy]=tf([(X[0]+X[1])/2,(Y[0]+Y[1])/2]);
    washes.push(lagg(blob(r,zx,zy,(X[1]-X[0])*cw*.62,(Y[1]-Y[0])*ch*.56,1),pal[0],.8,.8))}
  return{lines,washes}}

/* --- para ihop gammalt och nytt: närmast och mest lika först --- */
function pair(A,B,ghost){
  const pr=[];A.forEach((a,i)=>B.forEach((b,j)=>pr.push([Math.hypot(a.c[0]-b.c[0],a.c[1]-b.c[1])+Math.abs(a.z-b.z)*1.2,i,j])));
  pr.sort((x,y)=>x[0]-y[0]);const ua=new Set,ub=new Set,out=[];
  for(const[,i,j]of pr){if(ua.has(i)||ub.has(j))continue;ua.add(i);ub.add(j);out.push([A[i],B[j],0])}
  A.forEach((a,i)=>ua.has(i)||out.push([a,ghost(a),-1]));
  B.forEach((b,j)=>ub.has(j)||out.push([ghost(b),b,1]));
  return out}
function ghostWash(w){const p=new Float32Array(w.p);for(let i=0;i<K;i++){p[2*i]=w.c[0]+(p[2*i]-w.c[0])*.6;p[2*i+1]=w.c[1]+(p[2*i+1]-w.c[1])*.6}return{...w,p,a:0}}
const mixA=(a,b,t)=>{const o=new Float32Array(a.length);for(let i=0;i<a.length;i++)o[i]=a[i]+(b[i]-a[i])*t;return o};

/* --- ritning --- */
let BV=BO[0],BW=0;                 // aktuell darrvariant
function poly(ctx,p,off,l,cx,cy,s,dx,dy,bz=0){
  const X=i=>cx+(p[2*i]+(off?off[(l*K+i)*2]:0)-cx)*s+dx+BV[(i*2+BW)%331]*bz,Y=i=>cy+(p[2*i+1]+(off?off[(l*K+i)*2+1]:0)-cy)*s+dy+BV[(i*2+1+BW)%331]*bz;
  ctx.beginPath();ctx.moveTo((X(K-1)+X(0))/2,(Y(K-1)+Y(0))/2);
  for(let i=0;i<K;i++){const j=(i+1)%K;ctx.quadraticCurveTo(X(i),Y(i),(X(i)+X(j))/2,(Y(i)+Y(j))/2)}
  ctx.closePath()}
const rgba=(c,a,d=0)=>`rgba(${clamp(c[0]+d,0,255)|0},${clamp(c[1]+d,0,255)|0},${clamp(c[2]+d,0,255)|0},${a})`;
function washSoft(w){
  if(w.a<.004)return;const[cx,cy]=centroid(w.p);
  for(let l=0;l<L;l++){poly(sx,w.p,w.off,l,cx,cy,1,0,0);sx.fillStyle=rgba(w.col,w.a*.16);sx.fill()}
  for(let i=0;i<3;i++){poly(sx,w.p,w.off,i,cx,cy,w.bl[i*4+2],w.bl[i*4],w.bl[i*4+1]);sx.fillStyle=rgba(w.col,w.a*.22,w.bl[i*4+3]);sx.fill()}}
function washHard(w,i){
  const a=w.a*w.h;if(a<.004)return;const[cx,cy]=centroid(w.p),bz=LUGN?0:DARR*(1+w.z*.012);BW=i*37;
  for(let l=0;l<3;l++){poly(wx,w.p,w.off,l,cx,cy,1-l*.035,0,0,bz);wx.fillStyle=rgba(w.col,a*.3);wx.fill();
    if(l!==1){wx.lineWidth=l?1.4:2.4;wx.strokeStyle=rgba(w.col,a*(l?.25:.45),-30);wx.stroke()}}}
function pencil(ln,f0,f1,idx){
  const{p,o,pr,rg}=ln,m=N-1;
  for(let q=0;q<3;q++){
    const a0=Math.max(f0,rg[2*q]),a1=Math.min(f1,rg[2*q+1]);if(a1-a0<.03)continue;
    const i0=Math.floor(a0*m),i1=Math.ceil(a1*m),b=idx*29+q*53;
    const X=i=>p[2*i]+o[(q*N+i)*2]+BV[(i*2+b)%331]*DARR,Y=i=>p[2*i+1]+o[(q*N+i)*2+1]+BV[(i*2+1+b)%331]*DARR;
    for(let i=i0;i<i1;i+=4){const j=Math.min(i1,i+4),pp=pr[Math.min(m,i+2)];
      px.beginPath();px.moveTo(X(i),Y(i));
      for(let k=i+1;k<j;k++)px.quadraticCurveTo(X(k),Y(k),(X(k)+X(k+1))/2,(Y(k)+Y(k+1))/2);
      px.lineTo(X(j),Y(j));
      px.lineWidth=ln.w*(q?.55:1)*(.55+.6*pp);px.strokeStyle=`rgba(44,43,50,${clamp(ln.a*(q?.55:1)*pp)})`;px.stroke()}}}

const hack=(u,i)=>{const n=5+(i*7)%6;return !RYCK||u<=0?u:u>=1?1:Math.round(u*n+.2)/n};   // varje del rör sig i egna ryck
let LUGN=false,lugnBild=-1;        // färgytorna står still mellan övergångarna och ritas då bara en gång
function frame(WP,LP,t,tick=0,lugn=-1){
  BV=BO[tick%BO.length];LUGN=lugn>=0;
  if(!LUGN||lugnBild!==lugn){lugnBild=lugn;
  sx.setTransform(1,0,0,1,0,0);sx.globalCompositeOperation="source-over";sx.clearRect(0,0,softC.width,softC.height);
  sx.setTransform(1/F,0,0,1/F,0,0);sx.globalCompositeOperation="multiply";
  const ws=WP.map(([a,b],i)=>{const u=hack(ease(clamp(t*1.3-.3*i/WP.length)),i);
    return u<=0?a:u>=1?b:{p:mixA(a.p,b.p,u),off:mixA(a.off,b.off,u),bl:mixA(a.bl,b.bl,u),col:mixA(a.col,b.col,u),a:a.a+(b.a-a.a)*u,h:a.h+(b.h-a.h)*u,z:a.z+(b.z-a.z)*u}});
  ws.forEach(washSoft);
  wx.globalCompositeOperation="source-over";wx.clearRect(0,0,W,H);wx.imageSmoothingQuality="high";wx.drawImage(softC,0,0,W,H);
  wx.globalCompositeOperation="multiply";ws.forEach(washHard);
  wx.globalCompositeOperation="destination-out";wx.drawImage(eraseW,LUGN||!DARR?0:-(tick*37%80),LUGN||!DARR?0:-(tick*53%80))}
  const gx=DARR?-(tick*37%80):0,gy=DARR?-(tick*53%80):0;                // blyertskornet hoppar

  px.globalCompositeOperation="source-over";px.clearRect(0,0,W,H);px.lineCap=px.lineJoin="round";
  LP.forEach(([a,b,mode],i)=>{const u=hack(ease(clamp(t*1.35-.35*i/LP.length)),i+3);
    if(mode===0)pencil(u<=0?a:u>=1?b:{p:mixA(a.p,b.p,u),o:mixA(a.o,b.o,u),pr:mixA(a.pr,b.pr,u),rg:mixA(a.rg,b.rg,u),w:a.w+(b.w-a.w)*u,a:a.a+(b.a-a.a)*u},0,1,i);
    else if(mode>0)pencil(b,0,u,i);              // ny linje ritas fram
    else pencil(a,u,1,i)});                      // överbliven linje suddas från början
  px.globalCompositeOperation="destination-out";px.drawImage(eraseP,gy,gx);

  main.globalCompositeOperation="source-over";main.drawImage(paper,0,0);
  main.globalCompositeOperation="multiply";main.drawImage(washC,0,0);main.drawImage(penC,0,0)}

/* --- styrning --- */
const scenes=SLIDES.map(buildScene),stage=document.getElementById("stage"),txt=document.getElementById("txt"),hud=document.getElementById("hud");
let cur=0,raf=0,stats=[],tick=0,busy=false;
function setText(i){const s=SLIDES[i];txt.className=s.plats==="vanster"?"vanster":s.plats==="mitt"||s.plats==="hel"?"mitt":"hoger";
  txt.querySelector("h1").textContent=s.rubrik||"";document.getElementById("rader").innerHTML=(s.rader||[]).map(r=>"<p>"+r+"</p>").join("");
  document.getElementById("nr").textContent=(i+1)+" / "+SLIDES.length;txt.style.opacity=1}
function still(i){const s=scenes[i];frame(s.washes.map(w=>[w,w,0]),s.lines.map(l=>[l,l,0]),1,++tick,i)}
function go(d){
  const n=clamp(cur+d,0,SLIDES.length-1);if(n===cur)return;
  cancelAnimationFrame(raf);
  const A=scenes[cur],B=scenes[n],WP=pair(A.washes,B.washes,ghostWash),LP=pair(A.lines,B.lines,x=>x);
  WP.sort((p,q)=>q[1].z+q[0].z-p[1].z-p[0].z);
  cur=n;txt.style.opacity=0;busy=true;let swapped=false,last=-1;const t0=performance.now();stats=[];
  const step=now=>{const f=Math.floor((now-t0)*FPS/1000);
    if(f!==last){last=f;const t=clamp(f*1000/FPS/TID),s=performance.now();
      frame(WP,LP,t,++tick);stats.push(performance.now()-s);
      if(t>.5&&!swapped){swapped=true;setText(n)}
      if(t>=1){busy=false;showStats();return}}
    raf=requestAnimationFrame(step)};
  raf=requestAnimationFrame(step)}
let vilaT=0;function vila(){clearInterval(vilaT);if(VILA)vilaT=setInterval(()=>{if(!busy&&!document.hidden)still(cur)},1000/VILA)}
function showStats(){if(!stats.length)return;const s=[...stats].sort((a,b)=>a-b);
  hud.textContent=`${stats.length} rutor · median ${s[s.length>>1].toFixed(1)} ms · värsta ${s[s.length-1].toFixed(1)} ms · ${FPS} bilder/s`}
function fit(){const k=Math.min(innerWidth/16,innerHeight/9);stage.style.width=16*k+"px";stage.style.height=9*k+"px";stage.style.fontSize=16*k/100+"px"}
addEventListener("resize",fit);
addEventListener("keydown",e=>{
  if(["ArrowRight"," ","PageDown","Enter"].includes(e.key))go(1);
  else if(["ArrowLeft","PageUp","Backspace"].includes(e.key))go(-1);
  else if(e.key==="f"||e.key==="F")document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
  else if(e.key==="p"||e.key==="P")hud.style.display=hud.style.display==="block"?"none":"block"});
stage.addEventListener("click",e=>go(e.clientX<innerWidth*.3?-1:1));
fit();setText(0);still(0);vila();
window.__go=go;window.__stats=()=>stats;
</script>
</body>
